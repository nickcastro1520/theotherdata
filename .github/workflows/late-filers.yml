name: Late filers

# Once a day, pulls new SEC Form 12b-25 late-filing notices (NT 10-K / NT 10-Q) from the EDGAR daily index
# and writes public/data/late-filers.json (last ~30 days). Also runs the live late-filing test (scripts/live/). The commit redeploys the site on Vercel.
# EDGAR fair access: scripts/late-filers.mjs sends a User-Agent with a contact email and stays far under 10 requests/second.
on:
  schedule:
    - cron: "17 11 * * *"
    # Backup run at 12:00pm New York. Cron is UTC: 16:00 UTC in daylight time, 17:00 UTC in standard time;
    # both fire and the time guard below lets only the one that is noon in New York continue.
    - cron: "0 16 * * 1-5"
    - cron: "0 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: late-filers
  cancel-in-progress: false

jobs:
  late-filers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Time guard (backup run only at 12pm New York)
        id: guard
        run: |
          if [ "${{ github.event.schedule }}" = "0 16 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 17 * * 1-5" ]; then
            H=$(TZ=America/New_York date +%H)
            if [ "$H" != "12" ]; then echo "Not noon in New York ($H:00); skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.skip != '1'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.guard.outputs.skip != '1'
        run: node scripts/late-filers.mjs --days=30
      - if: steps.guard.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Live test: append new notices (before their entry close) to the append-only log, then score any that reached 63 trading days.
      - if: steps.guard.outputs.skip != '1'
        run: python3 scripts/live/log.py
      - if: steps.guard.outputs.skip != '1'
        run: python3 scripts/live/score.py
      - if: steps.guard.outputs.skip != '1'
        name: Append-only check (log and scores)
        run: python3 scripts/live/check_append_only.py HEAD
      - if: steps.guard.outputs.skip != '1'
        name: Commit if changed
        run: |
          git config user.name "nick castro"
          git config user.email "nickcastro1520@gmail.com"
          git add public/data/late-filers.json public/data/live-late-filings.jsonl public/data/live-late-filings-scores.jsonl public/data/live-late-filings-summary.json public/data/live-late-filings-runs.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: late filers $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
