name: Refresh signals

# Pulls fresh public data every 4 hours and commits it to public/data/.
# Each commit to main triggers a Vercel production deploy, so the site always serves the latest snapshot.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch public data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/refresh.mjs
      - name: Run tests
        run: node --test test/*.test.js
      - name: Commit if changed
        run: |
          git config user.name "nick castro"
          git config user.email "nickcastro1520@gmail.com"
          git add public/data data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
