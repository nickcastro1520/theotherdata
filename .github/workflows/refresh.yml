name: Refresh signals

# Pulls fresh public data every 4 hours and commits it to public/data/.
# Each commit to main triggers a Vercel production deploy, so the site always serves the latest snapshot.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # lib/sources.js imports xlsx (EIA Excel downloads); without this the refresh fails with ERR_MODULE_NOT_FOUND.
        run: npm ci
      - name: Fetch public data
        env:
          # All optional. Each feature turns on only when its secret exists.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/refresh.mjs
      - name: Score the track record (daily)
        # Scores logged leans (live log + labeled backtest) against Tiingo closing prices, once per UTC day.
        # Never blocks the signal refresh.
        continue-on-error: true
        timeout-minutes: 10
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/track-record.mjs --daily
      - name: Refresh US symbol directory (weekly)
        # Nasdaq Trader symbol files + SEC company_tickers_exchange.json -> public/data/symbols.json.
        # Skips unless the committed file is 7+ days old; never blocks the signal refresh.
        continue-on-error: true
        run: node scripts/build-symbols.mjs --max-age=7d
      - name: Run tests
        run: node --test test/*.test.js
      - name: Commit if changed
        run: |
          git config user.name "nick castro"
          git config user.email "nickcastro1520@gmail.com"
          git add public/data data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
